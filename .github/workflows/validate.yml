# CI: автопроверка структуры скилов и юнит-тесты валидатора.
# Запускается на каждый push в main и на каждый PR.
# Битовая структура скилов или сломанный валидатор не попадут в main.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Линтер структуры скилов: frontmatter, длины, ссылки, специфика.
      - name: Run validate_skills.py
        run: python3 scripts/validate_skills.py

      # 2. Синхронность версии во всех манифестах и README (страховка от
      #    ручных правок мимо bump-version.sh).
      - name: Check version sync
        run: python3 scripts/check_version_sync.py

      # 3. Все юнит-тесты (валидатор скилов + delivery_tools + bash-скрипты).
      - name: Run all tests
        run: python3 -m unittest discover tests -v
