name: 💡 Новый скил / улучшение
description: Предложить новый скил, дополнить существующий или улучшить coverage стандарта
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает
      description: На какую ситуацию в коде/задаче сейчас нет правила, хотя оно нужно?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Новый скил (`1c-<name>`), новая карточка в `references/`, или расширение существующего правила. Если есть upstream-стандарт — ссылка на v8std.
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Ссылка на стандарт v8std (если есть)
      placeholder: "https://github.com/zeegin/v8std/blob/main/docs/std/NNN.md"

  - type: checkboxes
    id: willing
    attributes:
      label: Готовы сделать PR?
      options:
        - label: Да, готов оформить PR по CONTRIBUTING.md
        - label: Нет, только идея
